name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests evals

      - name: Format check
        run: ruff format --check src tests evals

      - name: Type check
        run: mypy src

      # The suite needs no API key and no network: StubLLM stands in for the model
      # and FakeFetcher serves canned SEC/RSS documents.
      - name: Test
        run: pytest -q
