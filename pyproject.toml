[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-market-analyst"
version = "0.1.0"
description = "Autonomous market research analyst: gathers evidence, builds a cited analytical brief, and red-teams its own claims."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "yfinance>=0.2.40",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
analyst = "analyst.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"analyst.scribe" = ["templates/*.j2"]
"analyst.prompts" = ["v1/*.md"]
"analyst.service" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # UP042 wants StrEnum. `str, Enum` is the conventional Pydantic pattern and
    # changes `__str__` semantics; the code reads `.value` explicitly everywhere,
    # so the suggested rewrite is churn with a small behavioural risk.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
